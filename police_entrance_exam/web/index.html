<!doctype html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Polizei-Eignungsprüfung</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css?v=1.2.1" />
</head>
<body>
  <div id="tablet-stage" class="theme-root hidden" aria-hidden="true" data-theme="light">
    <div class="tablet-scene">
      <div class="tablet-device" role="presentation">
        <div class="tablet-side-controls" aria-hidden="true">
          <span class="tablet-hardware-btn tablet-hardware-btn--power"></span>
          <span class="tablet-hardware-btn tablet-hardware-btn--volume"></span>
        </div>
        <div class="tablet-chassis">
          <div class="tablet-bezel">
            <div class="tablet-camera" aria-hidden="true">
              <span class="tablet-camera-lens"></span>
            </div>
            <div class="tablet-screen">
              <header class="tablet-chrome">
                <span class="tablet-chrome-title" id="tablet-chrome-title">–</span>
                <div class="tablet-chrome-actions">
                  <button class="tablet-theme-btn" id="theme-toggle" type="button" aria-label="Dunkelmodus" title="Dunkelmodus">
                    <svg class="theme-icon theme-icon-moon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg>
                    <svg class="theme-icon theme-icon-sun" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
                  </button>
                  <button class="tablet-close-btn" id="close-nui" type="button" hidden aria-label="Schließen">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
                    Schließen
                  </button>
                </div>
              </header>
              <div id="app" class="tablet-screen-body" role="application" aria-label="Polizei-Eignungsprüfung"></div>
              <div id="certificate-overlay" class="theme-root hidden" aria-hidden="true" data-theme="light"></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script src="questions.js?v=1.2.1"></script>
  <script src="dom.js?v=1.2.1"></script>
  <script src="app.js?v=1.2.1"></script>
</body>
</html>
